name: CI

on:
  push:
    branches:
      - main
      - 0.1.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  python-contract:
    name: python-contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/requirements-quality.txt
      - name: Install unreleased Core and pinned quality tools
        run: |
          python -m pip install --upgrade pip==26.1
          python -m pip install -r ci/requirements-quality.txt
          python -m pip install --no-deps "rextio @ git+https://github.com/rextio/rextio.git@0.1.6"
          python -m pip install --no-deps -e .
      - name: Run mocked and fail-closed contracts
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check src tests scripts ci
      - name: Run mypy
        run: python -m mypy src

  rust-contract:
    name: rust-contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup component add --toolchain 1.93.1 rustfmt clippy
      - name: Verify format
        run: cargo +1.93.1 fmt --all -- --check
      - name: Run no-GPU Rust tests
        run: cargo +1.93.1 test --workspace
      - name: Run Clippy
        run: cargo +1.93.1 clippy --workspace --all-targets -- -D warnings
      - name: Release check
        run: cargo +1.93.1 check --workspace --release

  linux-aarch64-cross-check:
    name: rust-contract / Linux AArch64 cross-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install target
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup +1.93.1 target add aarch64-unknown-linux-gnu
      - name: Compile-check without linking or device discovery
        run: cargo +1.93.1 check --workspace --target aarch64-unknown-linux-gnu

  package:
    name: package / wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/requirements-package.txt
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip==26.1
          python -m pip install -r ci/requirements-package.txt
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
          python ci/check_distribution_contract.py dist/*.whl dist/*.tar.gz

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - python-contract
      - rust-contract
      - linux-aarch64-cross-check
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every build-only gate
        env:
          PYTHON_RESULT: ${{ needs.python-contract.result }}
          RUST_RESULT: ${{ needs.rust-contract.result }}
          CROSS_RESULT: ${{ needs.linux-aarch64-cross-check.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          python - <<'PY'
          import os
          results = {
              "python": os.environ["PYTHON_RESULT"],
              "rust": os.environ["RUST_RESULT"],
              "cross": os.environ["CROSS_RESULT"],
              "package": os.environ["PACKAGE_RESULT"],
          }
          failures = {key: value for key, value in results.items() if value != "success"}
          assert not failures, f"build-only CI gates failed: {failures}"
          PY
