[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rextio-device-cuda"
dynamic = ["version"]
description = "Incubating NVIDIA CUDA Device Provider API 1 Alpha for Rextio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Steve Si-young Song", email = "rextio.co@gmail.com"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "rextio>=0.1.6,<0.2",
]

[project.entry-points."rextio.device_providers"]
cuda = "rextio_device_cuda.provider:provider"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
dev = [
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.15",
  "twine>=5.0",
]

[tool.setuptools.dynamic]
version = {attr = "rextio_device_cuda.__about__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "D"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

